name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发版的 tag（形如 v1.0.0），留空只跑构建不发布'
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 关卡一：版本一致性 + 纯 Node 自检
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 版本号与 tag 对齐
        id: v
        env:
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION 不是 主.次.补：$version"
            exit 1
          fi
          if [[ -n "$REF_TAG" && "v$version" != "$REF_TAG" ]]; then
            echo "::error::VERSION=$version 与 tag=$REF_TAG 不一致"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "版本 $version / versionCode $code"
      - name: CHANGELOG 必须有本版小节
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          grep -qF "## [$version]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md 缺少 ## [$version] 小节"
            exit 1
          }
      - name: 自检
        run: node scripts/check.js
      - name: Dart 括号 / 字符串 / import 体检
        run: node scripts/check-dart.js

  # 关卡二：分析 + 测试
  test:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: 拉底座并注入
        run: |
          node scripts/prepare-base.js
          node scripts/apply-patches.js
          node scripts/sync-lib.js
          node scripts/bump-version.js "$(tr -d '[:space:]' < VERSION)"
      - name: 依赖
        working-directory: _wenku_base
        run: flutter pub get
      - name: 分析
        working-directory: _wenku_base
        run: flutter analyze --no-fatal-infos
      - name: 测试
        working-directory: _wenku_base
        run: flutter test test/fanhuo

  # 关卡三：三 ABI 构建（同一个 versionCode，可互相覆盖升级）
  build:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm64
            abi: arm64-v8a
            suffix: arm64
          - target: android-arm
            abi: armeabi-v7a
            suffix: armv7
          - target: android-x64
            abi: x86_64
            suffix: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: 拉底座并注入
        run: |
          node scripts/prepare-base.js
          node scripts/apply-patches.js
          node scripts/sync-lib.js
          node scripts/bump-version.js "$(tr -d '[:space:]' < VERSION)"
      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::没有配签名密钥，这次出的是 debug 签名包，只能自用不能覆盖升级"
            exit 0
          fi
          store="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$store"
          chmod 600 "$store"
          cat > _wenku_base/android/key.properties <<EOF
          storeFile=$store
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: 构建 ${{ matrix.suffix }}
        working-directory: _wenku_base
        run: |
          flutter build apk --release \
            --target-platform ${{ matrix.target }} \
            --dart-define=UPDATE_REPOSITORY=${{ github.repository }}
      - name: 改名归档
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          mkdir -p out
          cp _wenku_base/build/app/outputs/flutter-apk/app-release.apk \
             "out/fanhuo-reader-${VERSION}-${{ matrix.suffix }}.apk"
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.suffix }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  # 关卡四：验签 + 发版
  verify-and-release:
    needs: [check-version, build]
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: apk-*
          merge-multiple: true
      - name: 验签与内容
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)"
          AAPT2="$(find "$SDK/build-tools" -name aapt2 | sort -V | tail -1)"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for apk in artifacts/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1)) =="
            "$APKSIGNER" verify --print-certs "$apk" | head -5
            "$AAPT2" dump packagename "$apk"
            "$AAPT2" dump badging "$apk" | grep -E "versionCode|native-code|application-label:" | head -3
          done
          # 三包必须同名同 versionCode
          codes="$("$AAPT2" dump badging artifacts/*arm64*.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          echo "versionCode=$codes（期望 ${{ needs.check-version.outputs.version_code }}）"
          [[ "$codes" == "${{ needs.check-version.outputs.version_code }}" ]] || exit 1
      - name: 发版
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          notes="$(awk -v v="## [$VERSION]" 'index($0, v)==1 {flag=1} flag && /^## \[/ && index($0, v)!=1 {exit} flag' CHANGELOG.md)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.apk --clobber
          else
            gh release create "$TAG" artifacts/*.apk \
              --title "番茄阅读 Pro $TAG" \
              --notes "$notes" \
              --verify-tag
          fi
      - name: 清理签名材料
        if: always()
        run: rm -f _wenku_base/android/key.properties